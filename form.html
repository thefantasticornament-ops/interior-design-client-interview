<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#333333;--txt:#1a1a1a;--lbl:#666666;--r:12px;}
body{font-family:'DM Sans', sans-serif;background:#f4f4f0;background-attachment:fixed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--txt);}
.wa-card{background:#ffffff;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,0.4);width:100%;max-width:480px;padding:36px 32px;}
.wa-head{margin-bottom:28px;}
.wa-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.2);border-radius:50px;padding:4px 12px;font-size:.75rem;color:#333333;margin-bottom:14px;font-weight:600;}
.wa-logo{max-width:80px;max-height:80px;border-radius:var(--r);object-fit:cover;margin-bottom:14px;display:block;}
.wa-head h1{font-size:1.6rem;font-weight:700;color:var(--txt);line-height:1.2;margin-bottom:8px;}
.wa-head p{color:var(--lbl);font-size:.9rem;line-height:1.5;}
.wa-field{margin-bottom:18px;}
.wa-field label{display:block;font-size:.8rem;font-weight:600;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.wa-field label span{color:#ff6b6b;margin-left:2px;}
.wa-field input,.wa-field textarea,.wa-field select{width:100%;background:color-mix(in srgb, var(--txt) 6%, transparent);border:1px solid color-mix(in srgb, var(--txt) 20%, transparent);border-radius:var(--r);padding:10px 13px;color:var(--txt);font-family:'DM Sans', sans-serif;font-size:.9rem;transition:.2s;outline:none;}
.wa-field input:focus,.wa-field textarea:focus,.wa-field select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,211,102,0.15);}
.wa-field select option{background:#222;}
.wa-group-label{display:block;font-size:.8rem;font-weight:600;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.wa-option{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid color-mix(in srgb, var(--txt) 18%, transparent);border-radius:calc(var(--r) - 2px);margin-bottom:6px;cursor:pointer;transition:.2s;font-size:.9rem;color:var(--txt);}
.wa-option:hover{border-color:var(--acc);background:rgba(37,211,102,0.05);}
.wa-option input{width:auto;flex-shrink:0;}
.wa-stars{display:flex;gap:4px;align-items:center;}
.star-btn{background:none;border:none;font-size:1.6rem;color:color-mix(in srgb, var(--txt) 30%, transparent);cursor:pointer;padding:0;transition:.2s;line-height:1;}
.star-btn.on,.star-btn:hover{color:#333333;}
.wa-divider{text-align:center;position:relative;margin:22px 0 18px;}
.wa-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:color-mix(in srgb, var(--txt) 18%, transparent);}
.wa-divider span{position:relative;background:#ffffff;padding:0 12px;font-size:.8rem;color:var(--lbl);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
.wa-submit{width:100%;padding:14px;background:var(--acc);border:none;border-radius:var(--r);color:#fff;font-family:'DM Sans', sans-serif;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:.2s;letter-spacing:.01em;}
.wa-submit:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 20px rgba(37,211,102,0.35);}
.wa-submit:active{transform:translateY(0);}
.wa-err{color:#ff6b6b;font-size:.78rem;margin-top:4px;display:none;}
@media(max-width:520px){.wa-card{padding:24px 18px;}.wa-head h1{font-size:1.35rem;}}
</style>
</head>
